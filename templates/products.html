{% extends "base.html" %}

{% block title %}Products{% endblock %}
{% block breadcrumbs %}
<div class="breadcrumb-nav">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Products</li>
        </ol>
    </nav>
</div>
{% endblock %}
{% block content %}
<h1>Products</h1>
<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Short Name</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
            <tr>
                <td><a href="/products/{{ product.short_name }}">{{ product.full_name }}</a></td>
                <td>{{ product.short_name }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
