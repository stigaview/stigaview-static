name: Deploy
on: 
  push:
  pull_request: 

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "Setup Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.13
      - name: Install Python Dependencies
        run: pip install -r requirements.txt
      - name: Build It
        run: make

  check_product_files:
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora@sha256:f69eded677c301b72eebbe2c60761f7fcc006294f07ef6719b44da1f73af1d68
    steps:
      - name: "Install dependencies"
        run: dnf install -y openscap-scanner make
      - name: "Checkout the repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "Run each product XML file through openscap"
        run: make check-product-files
